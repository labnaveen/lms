<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlocalView LMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-3xl shadow-xl p-10 max-w-2xl text-center animate-fade-in">
    <h1 class="text-4xl font-bold text-blue-600 mb-4">GlocalView LMS</h1>
    <p class="text-gray-700 mb-6">A modern Learning Management System to empower schools, teachers, and students. Upload courses, manage assignments, track progress, and enhance learning outcomes — all in one platform.</p>
    <p class="text-gray-500 text-sm">© 2025 GlocalView LMS</p>
  </div>

  <!-- Simple fade-in animation -->
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 1s ease-out;
    }
  </style>

</body>
</html>
