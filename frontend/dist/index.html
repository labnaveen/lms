          Our eLearning platform requires JavaScript to deliver interactive

            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" class="noscript-step-svg">

            Enable JavaScript in 3 Steps:
          </h3>

          <div class="noscript-step">
            <div class="noscript-step-number">1</div>
            <div class="noscript-step-content">
              <strong class="noscript-step-strong-tag">Open Browser Settings</strong>
              <p class="noscript-step-paragraph">
                Click the three dots (⋮) in top-right corner → Select "Settings"
              </p>
            </div>
          </div>

          <div class="noscript-step">
            <div class="noscript-step-number">2</div>
            <div class="noscript-step-content">
              <strong class="noscript-step-strong-tag">Navigate to Site Settings</strong>
              <p class="noscript-step-paragraph">
                Go to <strong class="noscript-step-strong-tag">Privacy and security</strong> → Click
                <strong class="noscript-step-strong-tag">Site settings</strong>
              </p>
            </div>
          </div>

            <div class="noscript-step-number">3</div>

              <strong class="noscript-step-strong-tag">Enable JavaScript</strong>
